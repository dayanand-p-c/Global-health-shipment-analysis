name: Periodic Commit

on:
  schedule:
    # Runs every 3 days at 12:00 UTC
    - cron: "* * * * *"

  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make a change
        run: |
          echo "Last automated update: $(date -u)" > .last-update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .last-update
          git commit -m "chore: periodic update" || echo "No changes to commit"
          git push
